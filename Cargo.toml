[package]
name = "bastion-bridge-gpui"
version = "0.2.41"
edition = "2024"
license = "MIT"
repository = "https://github.com/jichengwei001/bastionterm"
description = "A terminal for AI agents working through interactive SSH bastions"

[dependencies]
gpui = { path = "vendor/gpui", features = ["runtime_shaders"] }
russh = { version = "0.54", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread","sync","time","macros","net"] }
vt100 = { path = "vendor/vt100" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
fs2 = "0.4"
tempfile = "3"
httparse = "1"
indexmap = "2"
url = "2"
chrono = "0.4"
unicode-segmentation = "1"
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }

[profile.dev]
debug = 0
incremental = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow", "NSView", "NSScreen", "NSPopover", "NSActionCell", "NSButtonCell", "NSCell", "NSMenuItemCell", "NSPopUpButtonCell", "NSMenu", "NSMenuItem", "NSViewController", "NSTextField", "NSControl", "NSFont", "NSColor", "NSColorSpace", "NSAppearance"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSGeometry"] }
